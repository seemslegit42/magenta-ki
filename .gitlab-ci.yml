# GitLab CI/CD Pipeline — Bun-Only Frontend/SSR + Go Microservice Gateway
# Branching Strategy: GitLab Flow (feature/* -> main -> staging -> production)

stages:
  - quality
  - test
  - build
  - deploy_staging
  - uat_and_production

variables:
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"
  GOPATH: "$CI_PROJECT_DIR/.go-cache"
  DOCKER_TLS_CERTDIR: "/certs"

cache:
  key: "${CI_COMMIT_REF_SLUG}-bun-go"
  paths:
    - .bun-cache/
    - node_modules/
    - .go-cache/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "production"'
    - if: '$CI_COMMIT_BRANCH =~ /^(feature|fix|hotfix)\/.+$/'

# ---------------------------------------------------------------------------
# Stage 1: Quality & Static Analysis (Bun + Biome + TypeScript)
# ---------------------------------------------------------------------------
quality:biome-and-typecheck:
  stage: quality
  image: oven/bun:1-alpine
  script:
    - bun install --frozen-lockfile || bun install
    - bun run lint:biome
    - bun run typecheck
    - bun run lint

# ---------------------------------------------------------------------------
# Stage 2: Multi-Tier Automated Testing (Bun Test + Go Test, Zero Playwright)
# ---------------------------------------------------------------------------
test:unit:
  stage: test
  image: oven/bun:1-alpine
  needs: ["quality:biome-and-typecheck"]
  script:
    - bun install --frozen-lockfile || bun install
    - bun test tests/unit

test:integration:
  stage: test
  image: oven/bun:1-alpine
  needs: ["quality:biome-and-typecheck"]
  script:
    - bun install --frozen-lockfile || bun install
    - bun test tests/integration

test:e2e:
  stage: test
  image: oven/bun:1-alpine
  needs: ["quality:biome-and-typecheck"]
  script:
    - bun install --frozen-lockfile || bun install
    - bun test tests/e2e

test:go-backend:
  stage: test
  image: golang:1.22-alpine
  needs: ["quality:biome-and-typecheck"]
  script:
    - cd go
    - go mod download
    - go vet ./...
    - go test -v -race ./...

# ---------------------------------------------------------------------------
# Stage 3: Production & Staging Artifact Builds
# ---------------------------------------------------------------------------
build:webos-ssr:
  stage: build
  image: oven/bun:1-alpine
  needs: ["test:unit", "test:integration", "test:e2e"]
  script:
    - bun install --frozen-lockfile || bun install
    - bun run build
  artifacts:
    name: "webos-ssr-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/
    expire_in: 7 days

build:go-gateway:
  stage: build
  image: golang:1.22-alpine
  needs: ["test:go-backend"]
  script:
    - mkdir -p bin
    - cd go
    - CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o ../bin/gateway-server ./cmd/server/main.go
  artifacts:
    name: "go-gateway-${CI_COMMIT_SHORT_SHA}"
    paths:
      - bin/gateway-server
    expire_in: 7 days

# ---------------------------------------------------------------------------
# Stage 4: Automated Staging Deployment & Health Verification
# ---------------------------------------------------------------------------
deploy:staging:
  stage: deploy_staging
  image: docker:27
  services:
    - docker:27-dind
  needs: ["build:webos-ssr", "build:go-gateway"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
  environment:
    name: staging
    url: https://staging.verdigris-webos.internal
  script:
    - docker build --tag "verdigris-webos:staging" --tag "verdigris-webos:${CI_COMMIT_SHORT_SHA}" --file Dockerfile .
    - docker compose -f docker-compose.staging.yml up -d --build
    - |
      apk add --no-cache curl
      curl --fail --retry 5 --retry-delay 3 http://localhost:3080/api/cicd/staging-health

# ---------------------------------------------------------------------------
# Stage 5: Business Stakeholder UAT Gate & Production Promotion
# ---------------------------------------------------------------------------
uat:verify-stakeholder-signoff:
  stage: uat_and_production
  image: oven/bun:1-alpine
  needs: ["deploy:staging"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "production"'
  script:
    - |
      echo "Verifying Business Stakeholder UAT sign-off status prior to production release..."
      bun -e '
        const url = process.env.STAGING_URL || "http://localhost:3080";
        console.log("UAT Gate target:", url + "/api/uat/signoff");
      '

deploy:production:
  stage: uat_and_production
  image: docker:27
  services:
    - docker:27-dind
  needs: ["build:webos-ssr", "build:go-gateway", "uat:verify-stakeholder-signoff"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      when: manual
  environment:
    name: production
    url: https://verdigris-webos.internal
  script:
    - docker build --tag "verdigris-webos:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" --tag "verdigris-webos:production" --file Dockerfile .
    - docker compose -f docker-compose.yml up -d --build
