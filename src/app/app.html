<main class="relative w-screen h-screen overflow-hidden flex flex-col bg-[#0E1015]">
  <!-- OS Status Bar -->
  <app-statusbar />

  <!-- Desktop Stage -->
  <div class="relative flex-1 overflow-hidden">
    <!-- Wallpaper Grid / Background Glow -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#3B0764]/30 via-[#0E1015] to-[#08090C] pointer-events-none"></div>
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-[#6A0DAD]/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-[#E0218A]/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Window Manager Layer -->
    @for (proc of windowManager.activeProcesses(); track proc.pid) {
      @if (proc.isOpen && !proc.isMinimized) {
        @let bounds = windowManager.getBounds(proc.pid);
        @if (bounds) {
          <app-window [descriptor]="proc" [bounds]="bounds" />
        }
      }
    }
  </div>

  <!-- Syncopated Dock -->
  <app-dock />
  <app-search />
</main>
