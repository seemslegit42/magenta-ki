version: '3.8'

include:
  - path: appwrite/docker-compose.yml

services:
  lexvos-ssr:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=3001
    networks:
      - gateway

  lexvos-api:
    build:
      context: ./go
      dockerfile: Dockerfile
    environment:
      - PORT=8080
    networks:
      - gateway
      - appwrite

  caddy:
    image: caddy:latest
    ports:
      - "3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - gateway

networks:
  gateway:
    name: gateway
  appwrite:
    name: appwrite
