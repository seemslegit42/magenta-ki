version: '3.8'

include:
  - path: appwrite/docker-compose.yml

services:
  verdigris-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    env_file:
      - ./appwrite.env
    restart: unless-stopped
    networks:
      - appwrite
      - gateway

networks:
  gateway:
    name: gateway
  appwrite:
    name: appwrite
